name: Build and deploy to staging

# Story 1-1. Supersedes the deploy-branch design (D7).
#
# WHY THE CHANGE: Hostinger's hPanel git integration could not be connected —
# the current UI offers only a GitHub App flow, which loops back to its own
# install prompt even with the app installed and repo access granted, and the
# manual repository-URL field the docs describe no longer exists. Rather than
# keep fighting it, this deploys straight to the server over SSH. That removes
# Hostinger's integration from the chain entirely and makes "push publishes"
# true by construction instead of dependent on an undocumented auto-pull.
#
# The deploy-branch push was REMOVED rather than kept as a fallback: two
# publish paths that can disagree is a divergence waiting to happen. If the
# hPanel integration is ever fixed, re-adding it is ten lines.
#
# SAFETY: the staging directory lives INSIDE the live WordPress document root
# (public_html/staging). rsync --delete aimed one level high would delete the
# production site, so the target is validated on the server BEFORE anything
# destructive runs. See the "Guard" step.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. Nothing here writes back to the repo.
permissions:
  contents: read

concurrency:
  group: deploy-staging
  # Deploys QUEUE, they do not race (AG-1 F7). Cancelling mid-run can kill
  # rsync partway through --delete, which leaves the target half-deleted and
  # serving a broken site until the next run finishes. On staging that is
  # annoying; at production cutover it is an outage. Queuing costs a minute.
  cancel-in-progress: false

env:
  STAGING_URL: https://staging.keegansmovementlab.com/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags (AG-1 F4). A tag is
      # mutable: whoever controls it can change what runs here, and this job
      # holds an SSH key to the server that serves production. The SHAs below
      # are what v4 resolved to on 2026-07-29. Both actions are on v7 now;
      # bumping the major is a separate, deliberate decision.
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Matches the version the build was proven on locally (v24.18.0).
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove the indexing gate works in BOTH directions
        # Story 1-2. Builds the site twice, once per environment, and asserts
        # production comes out indexable AND staging comes out hidden AND the
        # two outputs actually differ.
        #
        # Asserting only that THIS build is noindexed would be satisfied by a
        # hardcoded noindex — which is precisely the bug that de-indexes the
        # real site the day it ships. Proving one direction is not proving the
        # gate. Mutation-tested: hardcoding either polarity fails this step.
        run: npm run check:indexing

      - name: Verify the shared data layer
        # Story 1-3. These values go to a public page AND to a Google Business
        # Profile, so being wrong sends a real person to a locked door or to
        # another practitioner's booking page.
        #
        # Notably it asserts NINE opening-hours ranges, not seven: Tuesday and
        # Thursday each split around a 14:00-16:30 break. The story wrote that
        # as a review criterion, and a criterion a human has to remember is one
        # a human eventually forgets.
        run: npm run check:data

      - name: Build
        # ⚠️ SITE_ENV=staging is what hides this deploy from search engines.
        #
        # A PRODUCTION workflow must NOT copy this line. Unset (or
        # SITE_ENV=production) is the indexable default, chosen deliberately so
        # that a build which forgets to declare itself is the SURVIVABLE
        # mistake — see src/lib/site-env.mjs.
        run: npm run build
        env:
          SITE_ENV: staging

      - name: Stamp the build with this exact commit
        # AG-1 F1. The live check further down used to grep for MLW-SPIKE-1,
        # which is a CONSTANT — identical on every deploy. So a silent no-op
        # (rsync writes nothing, or writes somewhere stale) left the PREVIOUS
        # deploy's marker being served, the grep passed, and CI reported
        # "LIVE" having published nothing. Only the first-ever deploy could
        # ever have failed that check.
        #
        # This file makes the asserted value unique per commit, so the check
        # can actually fail for the reason it exists. It also lives OUTSIDE
        # the page content, so replacing the spike page in Phase 1 does not
        # break the assertion.
        run: |
          printf '%s\n' "${GITHUB_SHA}" > dist/build-id.txt
          echo "build id: ${GITHUB_SHA}"

      - name: Gate — the build must have produced what we expect
        # A build that exits 0 but emits nothing must fail HERE, rather than
        # rsync --delete faithfully replicating an empty directory onto the
        # live staging root.
        run: |
          test -s dist/index.html || { echo "::error::dist/index.html missing or empty"; exit 1; }
          grep -q "MLW-SPIKE-1" dist/index.html || { echo "::error::marker MLW-SPIKE-1 not in dist/index.html"; exit 1; }
          test -s dist/build-id.txt || { echo "::error::dist/build-id.txt missing or empty"; exit 1; }
          # The .htaccess is what denies dotfiles on the server. rsync --delete
          # would happily remove it if a build stopped emitting it, silently
          # disabling the guard the last step asserts. Fail closed instead.
          test -s dist/.htaccess || { echo "::error::dist/.htaccess missing — the dotfile guard would be deleted from the server"; exit 1; }

          # Story 1-2. The artefacts that control indexing must exist, and THIS
          # build (a staging build) must be the hidden polarity. If the
          # SITE_ENV above were ever dropped, the polarity check higher up
          # still passes — it builds both environments itself — so this is the
          # assertion that catches a mis-declared DEPLOY build specifically.
          test -s dist/robots.txt || { echo "::error::dist/robots.txt missing"; exit 1; }
          test -s dist/sitemap-index.xml || { echo "::error::dist/sitemap-index.xml missing — @astrojs/sitemap did not run"; exit 1; }
          grep -q 'content="noindex, nofollow"' dist/index.html || {
            echo "::error::this is the STAGING deploy but the build is not noindexed"
            echo "  (SITE_ENV=staging missing from the Build step?)"
            exit 1; }
          grep -qE '^\s*Disallow:\s*/\s*$' dist/robots.txt || {
            echo "::error::staging robots.txt does not disallow crawling"; exit 1; }

          # The visible "last updated" date must be the SYDNEY date, not the
          # runner's UTC date. This runner is UTC and Sydney is UTC+10/+11, so
          # any build after 2pm Sydney lands on the previous UTC day — the
          # machine-readable datetime and the visible text drift apart and
          # Australian readers get shown yesterday. Caught locally during 1-2.
          WANT_DATE=$(TZ=Australia/Sydney date +%F)
          grep -q "datetime=\"${WANT_DATE}\"" dist/index.html || {
            echo "::error::last-updated date is not today in Sydney (expected ${WANT_DATE})"
            grep -oE '<time datetime="[0-9-]+"' dist/index.html || echo "  (no <time> element found)"
            exit 1; }
          echo "last-updated date: ${WANT_DATE} (Sydney)"

          echo "build output:"
          find dist -type f | sort

      # ORDER IS LOAD-BEARING (AG-1 F4): npm ci and the build run ABOVE this
      # point, so a malicious dependency lifecycle script does not find the
      # deploy key on disk. Do not move the SSH setup earlier.
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Normalise connection settings
        # Secrets are pasted by hand into a web form, so a trailing space or a
        # stray newline rides along invisibly and breaks an exact-match lookup
        # with no useful error. Run #3 died exactly this way: known_hosts was
        # byte-perfect, but the host/port used to look it up carried whitespace.
        # Trim once here rather than trusting every paste to be clean forever.
        # Values stay masked in logs; only LENGTHS are printed, which is what
        # makes a stray character visible.
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          H=$(trim "${RAW_HOST}");  U=$(trim "${RAW_USER}")
          P=$(trim "${RAW_PORT}");  D=$(trim "${RAW_PATH}")

          printf 'host: %s -> %s chars\n' "$(printf '%s' "${RAW_HOST}" | wc -c | tr -d ' ')" "$(printf '%s' "$H" | wc -c | tr -d ' ')"
          printf 'user: %s -> %s chars\n' "$(printf '%s' "${RAW_USER}" | wc -c | tr -d ' ')" "$(printf '%s' "$U" | wc -c | tr -d ' ')"
          printf 'port: %s -> %s chars\n' "$(printf '%s' "${RAW_PORT}" | wc -c | tr -d ' ')" "$(printf '%s' "$P" | wc -c | tr -d ' ')"
          printf 'path: %s -> %s chars\n' "$(printf '%s' "${RAW_PATH}" | wc -c | tr -d ' ')" "$(printf '%s' "$D" | wc -c | tr -d ' ')"

          case "$P" in
            ''|*[!0-9]*) echo "::error::SSH_PORT is not a plain number after trimming"; exit 1 ;;
          esac

          # Character whitelist (AG-1 F8). These three values get interpolated
          # into a command that runs on the SERVER — the guard's quoted string
          # and rsync's remote path, which rsync also hands to a remote shell.
          # A quote, backtick, semicolon or $ in a pasted secret would break out
          # of that quoting. Nobody but a repo admin can set a secret, so this
          # is not a privilege boundary; it is the difference between a named
          # error here and a baffling server-side syntax error later.
          case "$D" in *[!A-Za-z0-9._/-]*) echo "::error::DEPLOY_PATH contains characters outside A-Za-z0-9._/-"; exit 1 ;; esac
          case "$H" in *[!A-Za-z0-9.-]*)   echo "::error::SSH_HOST contains characters outside A-Za-z0-9.-"; exit 1 ;; esac
          case "$U" in *[!A-Za-z0-9._-]*)  echo "::error::SSH_USER contains characters outside A-Za-z0-9._-"; exit 1 ;; esac

          {
            echo "H_HOST=$H"
            echo "H_USER=$U"
            echo "H_PORT=$P"
            echo "H_PATH=$D"
          } >> "$GITHUB_ENV"
        env:
          RAW_HOST: ${{ secrets.SSH_HOST }}
          RAW_USER: ${{ secrets.SSH_USER }}
          RAW_PORT: ${{ secrets.SSH_PORT }}
          RAW_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Diagnose — are the secrets well-formed?
        # Every failure so far has been a stored-secret problem, not a logic
        # problem (the steps below are proven against the real server). GitHub
        # masks secret VALUES in logs automatically, so this prints only
        # shapes, lengths and pass/fail — never the secrets themselves.
        # The key FINGERPRINT is safe to print: it identifies a public key.
        run: |
          echo "--- private key ---"
          if ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/derived.pub 2>/tmp/keyerr; then
            echo "parses OK"
            echo "fingerprint: $(ssh-keygen -lf /tmp/derived.pub | awk '{print $2}')"
            echo "expected   : SHA256:o8/xsmn90vPPKjiFNSgGzBaMVKVFTz9KB9MN8eilHl8"
          else
            echo "::error::SSH_PRIVATE_KEY does not parse as a private key"
            sed 's/^/  /' /tmp/keyerr
            echo "  (most likely: incomplete paste — the BEGIN/END lines must both be included)"
            exit 1
          fi

          echo "--- known_hosts ---"
          echo "lines: $(wc -l < ~/.ssh/known_hosts), bytes: $(wc -c < ~/.ssh/known_hosts)"
          if ssh-keygen -F "[${H_HOST}]:${H_PORT}" -f ~/.ssh/known_hosts > /dev/null 2>&1; then
            echo "host entry FOUND for the configured host/port"
          else
            echo "::error::SSH_KNOWN_HOSTS has no entry matching [SSH_HOST]:SSH_PORT"
            echo "  (most likely: the long base64 was truncated or line-wrapped when copied,"
            echo "   or SSH_HOST/SSH_PORT do not match the host the entry was made for)"
            exit 1
          fi

          echo "--- deploy path shape ---"
          case "${H_PATH}" in
            */staging) echo "ends in /staging: yes" ;;
            *) echo "::error::DEPLOY_PATH does not end in /staging (check for a trailing space or newline in the secret)"; exit 1 ;;
          esac
          printf 'length: %s chars\n' "$(printf '%s' "${H_PATH}" | wc -c | tr -d ' ')"

          echo "--- reachability ---"
          if ssh -i ~/.ssh/deploy_key -p "${H_PORT}" \
                 -o StrictHostKeyChecking=yes \
                 -o UserKnownHostsFile=~/.ssh/known_hosts \
                 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
                 "${H_USER}@${H_HOST}" 'echo AUTH_OK' 2>/tmp/ssherr; then
            echo "authenticated successfully"
          else
            echo "::error::could not authenticate to the server"
            sed 's/^/  /' /tmp/ssherr
            exit 1
          fi

      - name: Guard — refuse to deploy anywhere that isn't the staging root
        # Runs on the server, before rsync. Any failure aborts the job with
        # nothing written. StrictHostKeyChecking=yes is deliberate: an
        # unrecognised host key must fail, not prompt.
        run: |
          ssh -i ~/.ssh/deploy_key -p "${H_PORT}" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              "${H_USER}@${H_HOST}" \
              "TARGET='${H_PATH}'
               case \"\$TARGET\" in
                 */staging) ;;
                 *) echo 'REFUSING: deploy path does not end in /staging'; exit 1 ;;
               esac
               test -d \"\$TARGET\" || { echo 'REFUSING: target directory does not exist'; exit 1; }
               # AG-1 F3. The name test above is satisfied by ANY directory
               # called staging, and test -d follows symlinks — so a symlink
               # named staging pointing somewhere else passes both.
               #
               # Deliberately NOT requiring \$TARGET to equal its own resolved
               # path: shared hosts often symlink /home itself, which would
               # make a byte-equality check refuse a perfectly good target.
               # Instead: reject a symlinked final component (the actual
               # attack), then re-apply the same safety tests to the RESOLVED
               # path so a traversal cannot smuggle us somewhere else.
               test ! -L \"\$TARGET\" || { echo 'REFUSING: target itself is a symlink'; exit 1; }
               REAL=\$(readlink -f \"\$TARGET\")
               echo \"target resolves to: \$REAL\"
               case \"\$REAL\" in
                 */staging) ;;
                 *) echo \"REFUSING: resolved path does not end in /staging (\$REAL)\"; exit 1 ;;
               esac
               if [ -f \"\$REAL/wp-config.php\" ] || [ -d \"\$REAL/wp-admin\" ]; then
                 echo 'REFUSING: resolved path looks like a WordPress root'
                 exit 1
               fi
               if [ -f \"\$TARGET/wp-config.php\" ] || [ -d \"\$TARGET/wp-admin\" ]; then
                 echo 'REFUSING: target looks like a WordPress root, not our staging dir'
                 exit 1
               fi
               echo \"guard passed for \$TARGET\""

      - name: Deploy
        # The trailing slash on dist/ is load-bearing: it copies the CONTENTS
        # of dist rather than the directory itself.
        run: |
          rsync -rlvz --delete --checksum \
            -e "ssh -i ~/.ssh/deploy_key -p ${H_PORT} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes -o IdentitiesOnly=yes" \
            dist/ "${H_USER}@${H_HOST}:${H_PATH}/"

      - name: Prove THIS commit actually went live
        # AG-1 F1. Asserts the build id served by the real public URL equals
        # the commit that just built. A constant marker could not do this: it
        # survives a no-op deploy and reports green. This value cannot.
        run: |
          echo "waiting a moment for the filesystem to settle..."
          sleep 5

          SERVED=$(curl -fsSL --max-time 30 "${STAGING_URL}build-id.txt" | tr -d '[:space:]') || {
            echo "::error::could not fetch build-id.txt from ${STAGING_URL}"; exit 1; }
          if [ "$SERVED" != "${GITHUB_SHA}" ]; then
            echo "::error::the staging URL is NOT serving this commit"
            echo "  served : ${SERVED:-<empty>}"
            echo "  expected: ${GITHUB_SHA}"
            echo "  (the deploy silently did not land — check the rsync step and DEPLOY_PATH)"
            exit 1
          fi
          echo "LIVE: ${STAGING_URL} is serving ${GITHUB_SHA}"

          # Secondary: the page itself renders and still carries its marker.
          BODY=$(curl -fsSL --max-time 30 "${STAGING_URL}") || {
            echo "::error::staging URL did not return a successful response"; exit 1; }
          if ! printf '%s' "$BODY" | grep -q "MLW-SPIKE-1"; then
            echo "::error::marker MLW-SPIKE-1 NOT found in the served page"
            printf '%s' "$BODY" | head -40
            exit 1
          fi
          printf '%s' "$BODY" | grep -o 'deploy-stamp: [0-9]*'

      - name: Confirm the SERVED page and robots.txt hide staging
        # Story 1-2. The build gate proved the ARTEFACT; this proves the thing
        # the crawler actually fetches. Distinct surfaces — a correct build can
        # still land wrong, and robots.txt in particular fails SILENTLY (you
        # never see the traffic you did not get), so it gets a live assertion
        # rather than trust in the source file.
        run: |
          PAGE=$(curl -fsSL --max-time 30 "${STAGING_URL}") || {
            echo "::error::could not fetch the staging page"; exit 1; }
          printf '%s' "$PAGE" | grep -q 'content="noindex, nofollow"' || {
            echo "::error::the SERVED staging page is not noindexed — it can be indexed as a duplicate of production"
            printf '%s' "$PAGE" | grep -o '<meta name="robots"[^>]*>' || echo "  (no robots meta at all)"
            exit 1; }
          echo "served page: noindex present"

          ROBOTS=$(curl -fsSL --max-time 30 "${STAGING_URL}robots.txt") || {
            echo "::error::could not fetch robots.txt — it 404s, so nothing is disallowed"; exit 1; }
          printf '%s' "$ROBOTS" | grep -qE '^\s*Disallow:\s*/\s*$' || {
            echo "::error::served robots.txt does not disallow crawling"
            printf '%s' "$ROBOTS"
            exit 1; }
          echo "served robots.txt: Disallow: / present"

          # /sitemap.xml is the path registered with Search Console. The
          # integration emits sitemap-index.xml, so this only resolves if the
          # .htaccess rewrite is actually in force on the server — assert it
          # rather than assume mod_rewrite is enabled.
          SM=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${STAGING_URL}sitemap.xml" || echo 000)
          echo "/sitemap.xml -> HTTP ${SM}"
          [ "$SM" = "200" ] || { echo "::error::/sitemap.xml did not resolve (mod_rewrite off, or the rewrite is wrong)"; exit 1; }

      - name: Confirm the dotfile guard is actively denying
        # AG-1 F2. This used to accept ANY non-200, which meant a DNS blip or
        # a timeout (curl -> 000) reported "guard OK" having proved nothing.
        # Worse, it could not tell 403 (actively denied) from 404 (nothing
        # there to serve) — and since rsync only ships dist/, there is no .git
        # on the server at all, so it passed identically with the .htaccess
        # deleted. It was measuring absence, not denial.
        #
        # Verified live 2026-07-29: /.git/config -> 403, a nonexistent path
        # -> 404. So 403 is the specific correct answer, and the control
        # below makes the test fail loudly if the server ever stops
        # distinguishing the two.
        run: |
          DENIED=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${STAGING_URL}.git/config" || echo 000)
          CONTROL=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${STAGING_URL}no-such-path-control" || echo 000)
          echo ".git/config    -> HTTP ${DENIED}"
          echo "control path   -> HTTP ${CONTROL}"

          if [ "$DENIED" != "403" ]; then
            echo "::error::expected 403 (actively denied) for /.git/config, got ${DENIED}"
            exit 1
          fi
          if [ "$CONTROL" = "403" ]; then
            echo "::error::the control path also returned 403 — this test cannot distinguish denial from absence"
            exit 1
          fi
          echo "guard OK: dotfiles denied (403) while a missing path returns ${CONTROL}"
