name: Build and deploy to staging

# Story 1-1. Supersedes the deploy-branch design (D7).
#
# WHY THE CHANGE: Hostinger's hPanel git integration could not be connected —
# the current UI offers only a GitHub App flow, which loops back to its own
# install prompt even with the app installed and repo access granted, and the
# manual repository-URL field the docs describe no longer exists. Rather than
# keep fighting it, this deploys straight to the server over SSH. That removes
# Hostinger's integration from the chain entirely and makes "push publishes"
# true by construction instead of dependent on an undocumented auto-pull.
#
# The deploy-branch push was REMOVED rather than kept as a fallback: two
# publish paths that can disagree is a divergence waiting to happen. If the
# hPanel integration is ever fixed, re-adding it is ten lines.
#
# SAFETY: the staging directory lives INSIDE the live WordPress document root
# (public_html/staging). rsync --delete aimed one level high would delete the
# production site, so the target is validated on the server BEFORE anything
# destructive runs. See the "Guard" step.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. Nothing here writes back to the repo.
permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  STAGING_URL: https://staging.keegansmovementlab.com/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          # Matches the version the build was proven on locally (v24.18.0).
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Gate — the build must have produced what we expect
        # A build that exits 0 but emits nothing must fail HERE, rather than
        # rsync --delete faithfully replicating an empty directory onto the
        # live staging root.
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          grep -q "MLW-SPIKE-1" dist/index.html || { echo "::error::marker MLW-SPIKE-1 not in dist/index.html"; exit 1; }
          test -s dist/index.html || { echo "::error::dist/index.html is empty"; exit 1; }
          echo "build output:"
          find dist -type f | sort

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Normalise connection settings
        # Secrets are pasted by hand into a web form, so a trailing space or a
        # stray newline rides along invisibly and breaks an exact-match lookup
        # with no useful error. Run #3 died exactly this way: known_hosts was
        # byte-perfect, but the host/port used to look it up carried whitespace.
        # Trim once here rather than trusting every paste to be clean forever.
        # Values stay masked in logs; only LENGTHS are printed, which is what
        # makes a stray character visible.
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          H=$(trim "${RAW_HOST}");  U=$(trim "${RAW_USER}")
          P=$(trim "${RAW_PORT}");  D=$(trim "${RAW_PATH}")

          printf 'host: %s -> %s chars\n' "$(printf '%s' "${RAW_HOST}" | wc -c | tr -d ' ')" "$(printf '%s' "$H" | wc -c | tr -d ' ')"
          printf 'user: %s -> %s chars\n' "$(printf '%s' "${RAW_USER}" | wc -c | tr -d ' ')" "$(printf '%s' "$U" | wc -c | tr -d ' ')"
          printf 'port: %s -> %s chars\n' "$(printf '%s' "${RAW_PORT}" | wc -c | tr -d ' ')" "$(printf '%s' "$P" | wc -c | tr -d ' ')"
          printf 'path: %s -> %s chars\n' "$(printf '%s' "${RAW_PATH}" | wc -c | tr -d ' ')" "$(printf '%s' "$D" | wc -c | tr -d ' ')"

          case "$P" in
            ''|*[!0-9]*) echo "::error::SSH_PORT is not a plain number after trimming"; exit 1 ;;
          esac

          {
            echo "H_HOST=$H"
            echo "H_USER=$U"
            echo "H_PORT=$P"
            echo "H_PATH=$D"
          } >> "$GITHUB_ENV"
        env:
          RAW_HOST: ${{ secrets.SSH_HOST }}
          RAW_USER: ${{ secrets.SSH_USER }}
          RAW_PORT: ${{ secrets.SSH_PORT }}
          RAW_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Diagnose — are the secrets well-formed?
        # Every failure so far has been a stored-secret problem, not a logic
        # problem (the steps below are proven against the real server). GitHub
        # masks secret VALUES in logs automatically, so this prints only
        # shapes, lengths and pass/fail — never the secrets themselves.
        # The key FINGERPRINT is safe to print: it identifies a public key.
        run: |
          echo "--- private key ---"
          if ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/derived.pub 2>/tmp/keyerr; then
            echo "parses OK"
            echo "fingerprint: $(ssh-keygen -lf /tmp/derived.pub | awk '{print $2}')"
            echo "expected   : SHA256:o8/xsmn90vPPKjiFNSgGzBaMVKVFTz9KB9MN8eilHl8"
          else
            echo "::error::SSH_PRIVATE_KEY does not parse as a private key"
            sed 's/^/  /' /tmp/keyerr
            echo "  (most likely: incomplete paste — the BEGIN/END lines must both be included)"
            exit 1
          fi

          echo "--- known_hosts ---"
          echo "lines: $(wc -l < ~/.ssh/known_hosts), bytes: $(wc -c < ~/.ssh/known_hosts)"
          if ssh-keygen -F "[${H_HOST}]:${H_PORT}" -f ~/.ssh/known_hosts > /dev/null 2>&1; then
            echo "host entry FOUND for the configured host/port"
          else
            echo "::error::SSH_KNOWN_HOSTS has no entry matching [SSH_HOST]:SSH_PORT"
            echo "  (most likely: the long base64 was truncated or line-wrapped when copied,"
            echo "   or SSH_HOST/SSH_PORT do not match the host the entry was made for)"
            exit 1
          fi

          echo "--- deploy path shape ---"
          case "${H_PATH}" in
            */staging) echo "ends in /staging: yes" ;;
            *) echo "::error::DEPLOY_PATH does not end in /staging (check for a trailing space or newline in the secret)"; exit 1 ;;
          esac
          printf 'length: %s chars\n' "$(printf '%s' "${H_PATH}" | wc -c | tr -d ' ')"

          echo "--- reachability ---"
          if ssh -i ~/.ssh/deploy_key -p "${H_PORT}" \
                 -o StrictHostKeyChecking=yes \
                 -o UserKnownHostsFile=~/.ssh/known_hosts \
                 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
                 "${H_USER}@${H_HOST}" 'echo AUTH_OK' 2>/tmp/ssherr; then
            echo "authenticated successfully"
          else
            echo "::error::could not authenticate to the server"
            sed 's/^/  /' /tmp/ssherr
            exit 1
          fi

      - name: Guard — refuse to deploy anywhere that isn't the staging root
        # Runs on the server, before rsync. Any failure aborts the job with
        # nothing written. StrictHostKeyChecking=yes is deliberate: an
        # unrecognised host key must fail, not prompt.
        run: |
          ssh -i ~/.ssh/deploy_key -p "${H_PORT}" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              "${H_USER}@${H_HOST}" \
              "TARGET='${H_PATH}'
               case \"\$TARGET\" in
                 */staging) ;;
                 *) echo 'REFUSING: deploy path does not end in /staging'; exit 1 ;;
               esac
               test -d \"\$TARGET\" || { echo 'REFUSING: target directory does not exist'; exit 1; }
               if [ -f \"\$TARGET/wp-config.php\" ] || [ -d \"\$TARGET/wp-admin\" ]; then
                 echo 'REFUSING: target looks like a WordPress root, not our staging dir'
                 exit 1
               fi
               echo \"guard passed for \$TARGET\""

      - name: Deploy
        # The trailing slash on dist/ is load-bearing: it copies the CONTENTS
        # of dist rather than the directory itself.
        run: |
          rsync -rlvz --delete --checksum \
            -e "ssh -i ~/.ssh/deploy_key -p ${H_PORT} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes -o IdentitiesOnly=yes" \
            dist/ "${H_USER}@${H_HOST}:${H_PATH}/"

      - name: Prove it actually went live
        # Fetches the real public URL and asserts the marker is in the served
        # bytes. This is what makes "deployed" a fact rather than a claim: if
        # the deploy silently no-ops, this step fails.
        run: |
          echo "waiting a moment for the filesystem to settle..."
          sleep 5
          BODY=$(curl -fsSL --max-time 30 "${STAGING_URL}") || {
            echo "::error::staging URL did not return a successful response"; exit 1; }
          if ! printf '%s' "$BODY" | grep -q "MLW-SPIKE-1"; then
            echo "::error::marker MLW-SPIKE-1 NOT found in the served page"
            printf '%s' "$BODY" | head -40
            exit 1
          fi
          echo "LIVE: marker present at ${STAGING_URL}"
          printf '%s' "$BODY" | grep -o 'deploy-stamp: [0-9]*'

      - name: Confirm the .git guard is not serving anything
        # The .htaccess denies /.git. Assert it, rather than trusting it.
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${STAGING_URL}.git/config" || echo 000)
          echo ".git/config returned HTTP ${CODE}"
          case "$CODE" in
            200) echo "::error::.git is being served — the .htaccess guard is not working"; exit 1 ;;
            *)   echo "guard OK (not 200)" ;;
          esac
