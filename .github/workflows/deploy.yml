name: Build and deploy to staging

# Story 1-1. Supersedes the deploy-branch design (D7).
#
# WHY THE CHANGE: Hostinger's hPanel git integration could not be connected —
# the current UI offers only a GitHub App flow, which loops back to its own
# install prompt even with the app installed and repo access granted, and the
# manual repository-URL field the docs describe no longer exists. Rather than
# keep fighting it, this deploys straight to the server over SSH. That removes
# Hostinger's integration from the chain entirely and makes "push publishes"
# true by construction instead of dependent on an undocumented auto-pull.
#
# The deploy-branch push was REMOVED rather than kept as a fallback: two
# publish paths that can disagree is a divergence waiting to happen. If the
# hPanel integration is ever fixed, re-adding it is ten lines.
#
# SAFETY: the staging directory lives INSIDE the live WordPress document root
# (public_html/staging). rsync --delete aimed one level high would delete the
# production site, so the target is validated on the server BEFORE anything
# destructive runs. See the "Guard" step.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. Nothing here writes back to the repo.
permissions:
  contents: read

concurrency:
  group: deploy-staging
  # Deploys QUEUE, they do not race (AG-1 F7). Cancelling mid-run can kill
  # rsync partway through --delete, which leaves the target half-deleted and
  # serving a broken site until the next run finishes. On staging that is
  # annoying; at production cutover it is an outage. Queuing costs a minute.
  cancel-in-progress: false

# ⚠️ AG-3 F1. THESE TWO LINES ARE THE ONLY PLACE THIS WORKFLOW SAYS WHERE IT IS
# GOING, and every gate below derives its expectations from them. Nothing
# downstream writes out "noindex" or "Disallow: /" as a literal any more.
#
# WHY THAT MATTERS, and it is not hypothetical — Argus built the artifact and
# ran the old assertions against it. A production cutover workflow will almost
# certainly be born by copying this file, because the guard, the deploy path and
# the URL all need editing anyway. If `SITE_ENV: staging` survived that copy, the
# old gate published `noindex, nofollow` + staging canonicals + `Disallow: /` on
# the real domain and reported 7/7 PASS. Every assertion was written for the
# staging direction, so at cutover they confirmed the disaster instead of
# catching it. Recovery is weeks.
#
# TO CUT OVER TO PRODUCTION: change BOTH lines together. Changing one is caught —
# scripts/check-build.mjs refuses a build whose SITE_ENV and DEPLOY_URL disagree,
# which is the assertion the old workflow could not make because it had two
# declarations and compared neither.
env:
  SITE_ENV: staging
  DEPLOY_URL: https://staging.keegansmovementlab.com/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags (AG-1 F4). A tag is
      # mutable: whoever controls it can change what runs here, and this job
      # holds an SSH key to the server that serves production. The SHAs below
      # are what v4 resolved to on 2026-07-29. Both actions are on v7 now;
      # bumping the major is a separate, deliberate decision.
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Matches the version the build was proven on locally (v24.18.0).
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove the indexing gate works in BOTH directions
        # Story 1-2. Builds the site twice, once per environment, and asserts
        # production comes out indexable AND staging comes out hidden AND the
        # two outputs actually differ.
        #
        # Asserting only that THIS build is noindexed would be satisfied by a
        # hardcoded noindex — which is precisely the bug that de-indexes the
        # real site the day it ships. Proving one direction is not proving the
        # gate. Mutation-tested: hardcoding either polarity fails this step.
        run: npm run check:indexing

      - name: Verify the shared data layer
        # Story 1-3. These values go to a public page AND to a Google Business
        # Profile, so being wrong sends a real person to a locked door or to
        # another practitioner's booking page.
        #
        # Notably it asserts NINE opening-hours ranges, not seven: Tuesday and
        # Thursday each split around a 14:00-16:30 break. The story wrote that
        # as a review criterion, and a criterion a human has to remember is one
        # a human eventually forgets.
        run: npm run check:data

      - name: Build
        # SITE_ENV comes from the job-level env at the top of this file — the
        # ONE declaration. It used to be repeated here, which is how a copy of
        # this workflow could end up building for staging while every other line
        # said production.
        #
        # Unset (or SITE_ENV=production) is the indexable default, chosen
        # deliberately so a build that forgets to declare itself makes the
        # SURVIVABLE mistake — see src/lib/site-env.mjs.
        run: npm run build

      - name: Stamp the build with this exact commit
        # AG-1 F1. The live check further down used to grep for MLW-SPIKE-1,
        # which is a CONSTANT — identical on every deploy. So a silent no-op
        # (rsync writes nothing, or writes somewhere stale) left the PREVIOUS
        # deploy's marker being served, the grep passed, and CI reported
        # "LIVE" having published nothing. Only the first-ever deploy could
        # ever have failed that check.
        #
        # This file makes the asserted value unique per commit, so the check
        # can actually fail for the reason it exists. It also lives OUTSIDE
        # the page content, so replacing the spike page in Phase 1 does not
        # break the assertion.
        run: |
          printf '%s\n' "${GITHUB_SHA}" > dist/build-id.txt
          echo "build id: ${GITHUB_SHA}"

      - name: Gate — the build must have produced what we expect
        # A build that exits 0 but emits nothing must fail HERE, rather than
        # rsync --delete faithfully replicating an empty directory onto the
        # live staging root.
        #
        # ⚠️ THE BODY OF THIS STEP MOVED TO scripts/check-build.mjs (AG-3 F2 +
        # LN-2 F3). It used to be ~90 lines of inline bash that read
        # dist/index.html and nothing else, while six of the invariants it
        # asserted are stated site-wide ("NAP on every page", "no Review node on
        # ANY surface"). That held only because both pages happened to share a
        # layout — story 1-6 adds eight more, and one page with a hand-written
        # head would have passed every check here while shipping with no schema,
        # no NAP, and on staging with no noindex.
        #
        # It now walks every HTML file in dist/, and it checks the rendered TEXT
        # RUN as well as the markup, which is the layer Lens's jammed-tag defect
        # lived in and every gate here was blind to.
        run: npm run check:build
        env:
          # The second of the two declarations the script cross-checks. See the
          # env block at the top of this file.
          DEPLOY_URL: ${{ env.DEPLOY_URL }}

      - name: Gate — the deploy artifacts exist
        # ⚠️ THE MLW-SPIKE-1 ASSERTION WAS REMOVED HERE, IN THE SAME COMMIT AS
        # story 1-6 (which replaced the placeholder home page that carried it).
        # The 1-2 comment warned this had to happen together or the build fails
        # closed, and it was right.
        #
        # Nothing is lost: the marker was a CONSTANT, so it survived a no-op
        # deploy and reported green. dist/build-id.txt is the per-commit proof
        # that can actually fail for the reason it exists, and it lives outside
        # page content precisely so replacing a page cannot break it.
        run: |
          test -s dist/build-id.txt || { echo "::error::dist/build-id.txt missing or empty"; exit 1; }

          echo "build output:"
          find dist -type f | sort

      # ORDER IS LOAD-BEARING (AG-1 F4): npm ci and the build run ABOVE this
      # point, so a malicious dependency lifecycle script does not find the
      # deploy key on disk. Do not move the SSH setup earlier.
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Normalise connection settings
        # Secrets are pasted by hand into a web form, so a trailing space or a
        # stray newline rides along invisibly and breaks an exact-match lookup
        # with no useful error. Run #3 died exactly this way: known_hosts was
        # byte-perfect, but the host/port used to look it up carried whitespace.
        # Trim once here rather than trusting every paste to be clean forever.
        # Values stay masked in logs; only LENGTHS are printed, which is what
        # makes a stray character visible.
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          H=$(trim "${RAW_HOST}");  U=$(trim "${RAW_USER}")
          P=$(trim "${RAW_PORT}");  D=$(trim "${RAW_PATH}")

          printf 'host: %s -> %s chars\n' "$(printf '%s' "${RAW_HOST}" | wc -c | tr -d ' ')" "$(printf '%s' "$H" | wc -c | tr -d ' ')"
          printf 'user: %s -> %s chars\n' "$(printf '%s' "${RAW_USER}" | wc -c | tr -d ' ')" "$(printf '%s' "$U" | wc -c | tr -d ' ')"
          printf 'port: %s -> %s chars\n' "$(printf '%s' "${RAW_PORT}" | wc -c | tr -d ' ')" "$(printf '%s' "$P" | wc -c | tr -d ' ')"
          printf 'path: %s -> %s chars\n' "$(printf '%s' "${RAW_PATH}" | wc -c | tr -d ' ')" "$(printf '%s' "$D" | wc -c | tr -d ' ')"

          case "$P" in
            ''|*[!0-9]*) echo "::error::SSH_PORT is not a plain number after trimming"; exit 1 ;;
          esac

          # Character whitelist (AG-1 F8). These three values get interpolated
          # into a command that runs on the SERVER — the guard's quoted string
          # and rsync's remote path, which rsync also hands to a remote shell.
          # A quote, backtick, semicolon or $ in a pasted secret would break out
          # of that quoting. Nobody but a repo admin can set a secret, so this
          # is not a privilege boundary; it is the difference between a named
          # error here and a baffling server-side syntax error later.
          case "$D" in *[!A-Za-z0-9._/-]*) echo "::error::DEPLOY_PATH contains characters outside A-Za-z0-9._/-"; exit 1 ;; esac
          case "$H" in *[!A-Za-z0-9.-]*)   echo "::error::SSH_HOST contains characters outside A-Za-z0-9.-"; exit 1 ;; esac
          case "$U" in *[!A-Za-z0-9._-]*)  echo "::error::SSH_USER contains characters outside A-Za-z0-9._-"; exit 1 ;; esac

          {
            echo "H_HOST=$H"
            echo "H_USER=$U"
            echo "H_PORT=$P"
            echo "H_PATH=$D"
          } >> "$GITHUB_ENV"
        env:
          RAW_HOST: ${{ secrets.SSH_HOST }}
          RAW_USER: ${{ secrets.SSH_USER }}
          RAW_PORT: ${{ secrets.SSH_PORT }}
          RAW_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Diagnose — are the secrets well-formed?
        # Every failure so far has been a stored-secret problem, not a logic
        # problem (the steps below are proven against the real server). GitHub
        # masks secret VALUES in logs automatically, so this prints only
        # shapes, lengths and pass/fail — never the secrets themselves.
        # The key FINGERPRINT is safe to print: it identifies a public key.
        run: |
          echo "--- private key ---"
          if ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/derived.pub 2>/tmp/keyerr; then
            echo "parses OK"
            echo "fingerprint: $(ssh-keygen -lf /tmp/derived.pub | awk '{print $2}')"
            echo "expected   : SHA256:o8/xsmn90vPPKjiFNSgGzBaMVKVFTz9KB9MN8eilHl8"
          else
            echo "::error::SSH_PRIVATE_KEY does not parse as a private key"
            sed 's/^/  /' /tmp/keyerr
            echo "  (most likely: incomplete paste — the BEGIN/END lines must both be included)"
            exit 1
          fi

          echo "--- known_hosts ---"
          echo "lines: $(wc -l < ~/.ssh/known_hosts), bytes: $(wc -c < ~/.ssh/known_hosts)"
          if ssh-keygen -F "[${H_HOST}]:${H_PORT}" -f ~/.ssh/known_hosts > /dev/null 2>&1; then
            echo "host entry FOUND for the configured host/port"
          else
            echo "::error::SSH_KNOWN_HOSTS has no entry matching [SSH_HOST]:SSH_PORT"
            echo "  (most likely: the long base64 was truncated or line-wrapped when copied,"
            echo "   or SSH_HOST/SSH_PORT do not match the host the entry was made for)"
            exit 1
          fi

          echo "--- deploy path shape ---"
          case "${H_PATH}" in
            */staging) echo "ends in /staging: yes" ;;
            *) echo "::error::DEPLOY_PATH does not end in /staging (check for a trailing space or newline in the secret)"; exit 1 ;;
          esac
          printf 'length: %s chars\n' "$(printf '%s' "${H_PATH}" | wc -c | tr -d ' ')"

          echo "--- reachability ---"
          # ⚠️ RETRIED, BECAUSE THIS FAILURE IS INTERMITTENT AND NOT OURS.
          # Runs #14 and #17 both died here while #15 and #16 passed, on
          # byte-identical secrets — roughly half of four consecutive runs. A
          # wrong key or a missing known_hosts entry fails EVERY time; failing
          # every other time is Hostinger's shared-host SSH refusing a connection
          # under load. The three checks above already proved the secrets are
          # well-formed, so by the time we get here the only thing left to fail
          # is the connection itself, which is the textbook case for a retry.
          #
          # Bounded and loud: three attempts, backing off, and it still fails the
          # build if all three fail. What it must NOT do is silently mask a
          # genuinely dead key — hence the per-attempt output and the final
          # error naming how many attempts were made.
          # ⚠️ CAUSE STILL UNRESOLVED. TWO THEORIES TRIED AND BOTH FALSIFIED —
          # read this before forming a third.
          #
          # SYMPTOM, stable across 12 runs: this step fails roughly half the
          # time, and every failing attempt consumes its FULL connect timeout.
          # Byte-identical secrets, no correlation with spacing.
          #
          # THEORY 1, a fail2ban-style block. Falsified: a re-run minutes later
          # succeeds untouched, and a ban does not lift and re-apply on that
          # cadence.
          #
          # THEORY 2, DNS round-robin. It looked decisive — the account hostname
          # resolves to a ROTATING POOL and only one machine in it answers SSH,
          # which would explain the ~50% rate and the full timeouts exactly. So
          # SSH_HOST was pinned to the literal IP and SSH_KNOWN_HOSTS updated to
          # match. FALSIFIED BY RUN #24: with DNS removed from the path
          # entirely, the same failure returned with the same signature.
          #
          # WHAT IS ACTUALLY ESTABLISHED, and it is narrow:
          #   - the pinned IP answers on 65002 reliably from a home connection
          #     (8/8 consecutive probes)
          #   - GitHub runners reach it only intermittently, and when they fail
          #     they wait out the whole timeout
          #   - HTTP to the same account is unaffected throughout
          # That combination points at something between GitHub's egress and
          # Hostinger dropping SYNs — filtering or rate limiting on the provider
          # side is the remaining candidate, and it needs THEIR logs to confirm.
          # See UD-27; it is a support question now, not a workflow one.
          #
          # DO NOT WIDEN THE RETRY. Five attempts over ~3.7 minutes was tried and
          # failed; the outage outlasts any budget worth spending on a deploy.
          # A re-run from the Actions UI is the cheap workaround while this
          # stands.
          AUTH_OK=0
          for ATTEMPT in 1 2; do
            if ssh -i ~/.ssh/deploy_key -p "${H_PORT}" \
                   -o StrictHostKeyChecking=yes \
                   -o UserKnownHostsFile=~/.ssh/known_hosts \
                   -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
                   "${H_USER}@${H_HOST}" 'echo AUTH_OK' 2>/tmp/ssherr; then
              echo "authenticated successfully (attempt ${ATTEMPT})"
              AUTH_OK=1
              break
            fi
            echo "attempt ${ATTEMPT} failed:"
            sed 's/^/    /' /tmp/ssherr
            [ "$ATTEMPT" -lt 2 ] && sleep 20
          done

          if [ "$AUTH_OK" != "1" ]; then
            echo "::error::could not reach the server (2 attempts)"
            echo "  If both attempts hit the FULL 20s timeout, the connection is being dropped by a firewall,
          echo "  not refused and not rejected — check hPanel for an SSH block and see UD-27.""
            echo "  Check the secrets, and check hPanel for an SSH or host-key change."
            sed 's/^/  /' /tmp/ssherr
            exit 1
          fi

      - name: Guard — refuse to deploy anywhere that isn't the staging root
        # Runs on the server, before rsync. Any failure aborts the job with
        # nothing written. StrictHostKeyChecking=yes is deliberate: an
        # unrecognised host key must fail, not prompt.
        run: |
          ssh -i ~/.ssh/deploy_key -p "${H_PORT}" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              "${H_USER}@${H_HOST}" \
              "TARGET='${H_PATH}'
               case \"\$TARGET\" in
                 */staging) ;;
                 *) echo 'REFUSING: deploy path does not end in /staging'; exit 1 ;;
               esac
               test -d \"\$TARGET\" || { echo 'REFUSING: target directory does not exist'; exit 1; }
               # AG-1 F3. The name test above is satisfied by ANY directory
               # called staging, and test -d follows symlinks — so a symlink
               # named staging pointing somewhere else passes both.
               #
               # Deliberately NOT requiring \$TARGET to equal its own resolved
               # path: shared hosts often symlink /home itself, which would
               # make a byte-equality check refuse a perfectly good target.
               # Instead: reject a symlinked final component (the actual
               # attack), then re-apply the same safety tests to the RESOLVED
               # path so a traversal cannot smuggle us somewhere else.
               test ! -L \"\$TARGET\" || { echo 'REFUSING: target itself is a symlink'; exit 1; }
               REAL=\$(readlink -f \"\$TARGET\")
               echo \"target resolves to: \$REAL\"
               case \"\$REAL\" in
                 */staging) ;;
                 *) echo \"REFUSING: resolved path does not end in /staging (\$REAL)\"; exit 1 ;;
               esac
               if [ -f \"\$REAL/wp-config.php\" ] || [ -d \"\$REAL/wp-admin\" ]; then
                 echo 'REFUSING: resolved path looks like a WordPress root'
                 exit 1
               fi
               if [ -f \"\$TARGET/wp-config.php\" ] || [ -d \"\$TARGET/wp-admin\" ]; then
                 echo 'REFUSING: target looks like a WordPress root, not our staging dir'
                 exit 1
               fi
               echo \"guard passed for \$TARGET\""

      - name: Deploy
        # The trailing slash on dist/ is load-bearing: it copies the CONTENTS
        # of dist rather than the directory itself.
        #
        # Retried for the same reason as the reachability probe: the observed
        # failure mode on this host is an intermittently refused SSH connection,
        # and a transfer that drops halfway is the same class of problem.
        #
        # SAFE TO RETRY, and worth stating why rather than assuming it: rsync
        # here is IDEMPOTENT. --checksum means it compares content rather than
        # timestamps, and --delete converges the target on dist/ regardless of
        # what a half-finished previous attempt left behind. Re-running cannot
        # compound damage; it can only finish the job. The server-side guard has
        # already passed by this point, so the target is known-correct.
        run: |
          for ATTEMPT in 1 2 3; do
            if rsync -rlvz --delete --checksum \
                 -e "ssh -i ~/.ssh/deploy_key -p ${H_PORT} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20" \
                 dist/ "${H_USER}@${H_HOST}:${H_PATH}/"; then
              echo "deployed (attempt ${ATTEMPT})"
              exit 0
            fi
            echo "rsync attempt ${ATTEMPT} failed"
            [ "$ATTEMPT" -lt 3 ] && sleep $((ATTEMPT * 10))
          done
          echo "::error::rsync failed 3 times — this is not the intermittent pattern the retry exists for"
          exit 1

      - name: Prove THIS commit actually went live
        # AG-1 F1. Asserts the build id served by the real public URL equals
        # the commit that just built. A constant marker could not do this: it
        # survives a no-op deploy and reports green. This value cannot.
        run: |
          echo "waiting a moment for the filesystem to settle..."
          sleep 5

          SERVED=$(curl -fsSL --max-time 30 "${DEPLOY_URL}build-id.txt" | tr -d '[:space:]') || {
            echo "::error::could not fetch build-id.txt from ${DEPLOY_URL}"; exit 1; }
          if [ "$SERVED" != "${GITHUB_SHA}" ]; then
            echo "::error::${DEPLOY_URL} is NOT serving this commit"
            echo "  served : ${SERVED:-<empty>}"
            echo "  expected: ${GITHUB_SHA}"
            echo "  (the deploy silently did not land — check the rsync step and DEPLOY_PATH)"
            exit 1
          fi
          echo "LIVE: ${DEPLOY_URL} is serving ${GITHUB_SHA}"

          # Secondary: the page itself actually renders. The MLW-SPIKE-1 marker
          # check that used to live here went with the placeholder page in story
          # 1-6; the served page now has to carry the real business name, which
          # is a stronger assertion because it is the name the whole Google
          # corroboration depends on.
          BODY=$(curl -fsSL --max-time 30 "${DEPLOY_URL}") || {
            echo "::error::${DEPLOY_URL} did not return a successful response"; exit 1; }
          if ! printf '%s' "$BODY" | grep -q "Keegans Movement Lab"; then
            echo "::error::the served home page does not carry the business name"
            printf '%s' "$BODY" | head -40
            exit 1
          fi
          echo "served page renders and carries the business name"

      - name: Confirm the SERVED page matches the declared environment
        # Story 1-2. The build gate proved the ARTEFACT; this proves the thing
        # the crawler actually fetches. Distinct surfaces — a correct build can
        # still land wrong, and robots.txt in particular fails SILENTLY (you
        # never see the traffic you did not get), so it gets a live assertion
        # rather than trust in the source file.
        #
        # ⚠️ AG-3 F1. THE EXPECTED ANSWER IS DERIVED, NOT WRITTEN OUT. This step
        # used to grep the served page for the literal `noindex, nofollow`. On a
        # production cutover it would have fetched the PRODUCTION url and happily
        # confirmed that production was noindexed. Green, and catastrophic.
        run: |
          if [ "${SITE_ENV}" = "staging" ]; then
            WANT_META='content="noindex, nofollow"'
            WANT_ROBOTS='^[[:space:]]*Disallow:[[:space:]]*/[[:space:]]*$'
            ROBOTS_DESC='Disallow: /'
          else
            WANT_META='content="index, follow"'
            WANT_ROBOTS='^[[:space:]]*Allow:[[:space:]]*/[[:space:]]*$'
            ROBOTS_DESC='Allow: /'
          fi
          echo "SITE_ENV=${SITE_ENV} -> expecting ${WANT_META} and a robots.txt with ${ROBOTS_DESC}"

          PAGE=$(curl -fsSL --max-time 30 "${DEPLOY_URL}") || {
            echo "::error::could not fetch ${DEPLOY_URL}"; exit 1; }
          printf '%s' "$PAGE" | grep -q "${WANT_META}" || {
            echo "::error::the SERVED page does not carry ${WANT_META} for SITE_ENV=${SITE_ENV}"
            printf '%s' "$PAGE" | grep -o '<meta name="robots"[^>]*>' || echo "  (no robots meta at all)"
            exit 1; }
          echo "served page: correct robots meta for this environment"

          ROBOTS=$(curl -fsSL --max-time 30 "${DEPLOY_URL}robots.txt") || {
            echo "::error::could not fetch robots.txt — it 404s, so no policy is being served at all"; exit 1; }
          printf '%s' "$ROBOTS" | grep -qE "${WANT_ROBOTS}" || {
            echo "::error::served robots.txt does not carry ${ROBOTS_DESC} for SITE_ENV=${SITE_ENV}"
            printf '%s' "$ROBOTS"
            exit 1; }
          echo "served robots.txt: ${ROBOTS_DESC} present"

          # The reverse assertion. Without it, a production robots.txt that
          # contained BOTH an Allow and a leftover blanket Disallow would pass
          # the check above while still hiding the site.
          if [ "${SITE_ENV}" != "staging" ]; then
            printf '%s' "$ROBOTS" | grep -qE '^[[:space:]]*Disallow:[[:space:]]*/[[:space:]]*$' && {
              echo "::error::a PRODUCTION robots.txt contains a blanket 'Disallow: /' — this hides the real site"
              printf '%s' "$ROBOTS"
              exit 1; }
            printf '%s' "$PAGE" | grep -q 'noindex' && {
              echo "::error::a PRODUCTION page contains 'noindex' — this de-indexes the real site"
              exit 1; }
            printf '%s' "$PAGE" | grep -q 'rel="canonical" href="https://staging\.' && {
              echo "::error::a PRODUCTION page carries a STAGING canonical — every page would point at a noindexed host"
              exit 1; }
            echo "production reverse-checks: no noindex, no blanket Disallow, no staging canonical"
          fi

          # /sitemap.xml is the path registered with Search Console. The
          # integration emits sitemap-index.xml, so this only resolves if the
          # .htaccess rewrite is actually in force on the server — assert it
          # rather than assume mod_rewrite is enabled.
          #
          # AG-3 F3 / AG-4 residual 3. THIS is the assertion that proves OUR
          # .htaccess is being read, and it checks CONTENT rather than status,
          # because status alone does not discriminate. Measured on both hosts:
          #
          #   production /sitemap.xml -> 200, but it is All in One SEO's
          #     WordPress sitemap, carrying an XSL stylesheet and a plugin banner
          #   staging    /sitemap.xml -> 200, a bare <sitemapindex> whose only
          #     <loc> is sitemap-0.xml
          #
          # Only @astrojs/sitemap emits the second shape, and it is only
          # reachable at /sitemap.xml because our RewriteRule maps it onto
          # sitemap-index.xml. So asserting the SHAPE proves our file is in
          # force; asserting 200 would have passed on a host running WordPress.
          SM=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${DEPLOY_URL}sitemap.xml" || echo 000)
          echo "/sitemap.xml -> HTTP ${SM}"
          [ "$SM" = "200" ] || { echo "::error::/sitemap.xml did not resolve (mod_rewrite off, or the rewrite is wrong)"; exit 1; }

          SM_BODY=$(curl -fsSL --max-time 20 "${DEPLOY_URL}sitemap.xml" || echo '')
          printf '%s' "$SM_BODY" | grep -q '<sitemapindex' || {
            echo "::error::/sitemap.xml is not a sitemap index — something else is answering that path"
            printf '%s' "$SM_BODY" | head -c 300; exit 1; }
          printf '%s' "$SM_BODY" | grep -q 'sitemap-0\.xml' || {
            echo "::error::/sitemap.xml does not point at sitemap-0.xml, so it is NOT the Astro sitemap"
            echo "  our RewriteRule is not in force, or another sitemap is answering this path"
            printf '%s' "$SM_BODY" | head -c 300; exit 1; }
          echo "our .htaccess IS in force: /sitemap.xml serves the Astro sitemap index via our rewrite"

      - name: Confirm the migration redirect map is live
        # Story 1-7 + spec G-2. This lives IN the deploy workflow, on purpose.
        # Vigil's words: a migration guard that fires on EVERY deploy is worth
        # more than one that fires once on launch day. A standalone script is a
        # script somebody has to remember, and the failure it catches is silent —
        # a dead link costs a visitor and a ranking, and nothing errors.
        #
        # ENUMERATED HERE RATHER THAN DERIVED FROM .htaccess ON PURPOSE. If this
        # check read the same file it is testing, it would pass for any map,
        # including an empty one. The table below is an INDEPENDENT statement of
        # what the URLs must do, so a rule deleted from .htaccess fails here.
        #
        # Each row: path|expected-status|expected-final-path (empty = no
        # destination check). The KEEP rows are as load-bearing as the redirects:
        # they are what catches a rule whose pattern is too greedy — the
        # /group-classes rule swallowing /services/group-classes/ is the exact
        # mistake the ^ anchors exist to prevent.
        run: |
          MAP='
          /|200|
          /about/|200|
          /contact/|200|
          /services/|200|
          /services/chiropractic-treatment/|200|
          /services/group-classes/|200|
          /services/handstand/|200|
          /privacy/|200|
          /services/mobility-coaching/|301|/services/chiropractic-treatment/
          /handstand-coaching/|301|/services/handstand/
          /group-classes/|301|/services/group-classes/
          /hello-world-2/|410|
          '
          FAILED=0
          CHECKED=0
          while IFS='|' read -r PATHNAME WANT_CODE WANT_DEST; do
            [ -z "$PATHNAME" ] && continue
            CHECKED=$((CHECKED + 1))
            URL="${DEPLOY_URL%/}${PATHNAME}"

            # -o /dev/null keeps the body out; no -L, because following the
            # redirect would hide the very status code being asserted.
            GOT_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            GOT_DEST=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 "$URL" || echo '')

            if [ "$GOT_CODE" != "$WANT_CODE" ]; then
              echo "::error::${PATHNAME} returned ${GOT_CODE}, expected ${WANT_CODE}"
              FAILED=$((FAILED + 1))
              continue
            fi

            if [ -n "$WANT_DEST" ]; then
              # Compare the PATH only. The host differs between staging and
              # production, and the .htaccess targets are relative so that the
              # same map is correct on both.
              GOT_PATH=$(printf '%s' "$GOT_DEST" | sed -E 's#^https?://[^/]+##')
              if [ "$GOT_PATH" != "$WANT_DEST" ]; then
                echo "::error::${PATHNAME} redirects to ${GOT_PATH:-<nothing>}, expected ${WANT_DEST}"
                FAILED=$((FAILED + 1))
                continue
              fi
              echo "  OK  ${PATHNAME} -> ${GOT_CODE} -> ${WANT_DEST}"
            else
              echo "  OK  ${PATHNAME} -> ${GOT_CODE}"
            fi
          done <<< "$MAP"

          echo "redirect map: ${CHECKED} URLs checked, ${FAILED} wrong"
          [ "$FAILED" -eq 0 ] || {
            echo "::error::the migration redirect map is not live — a missed URL is a dead link plus lost ranking"
            exit 1; }

      - name: Confirm dotfiles are not served
        # AG-1 F2. This used to accept ANY non-200, which meant a DNS blip or
        # a timeout (curl -> 000) reported "guard OK" having proved nothing.
        #
        # ⚠️ AG-3 F3, WITH A CORRECTION TO ITS PREMISE — measured, not reasoned.
        #
        # Argus's finding was that this step credited our .htaccess for a 403 it
        # could not produce: our file denies with `RedirectMatch 404`, the step
        # demanded exactly 403, and the production apex returns the same 403
        # WITHOUT our file. Conclusion: the denial comes from Hostinger or the
        # parent WordPress .htaccess, so the check never tested our artifact.
        #
        # The conclusion (this step did not prove our file) was RIGHT. The
        # premise was WRONG, and it matters. I served this exact dist/ under a
        # real Apache 2.4 and isolated each directive:
        #
        #   full .htaccess          /.git/config -> 403   /.htaccess -> 403
        #   RedirectMatch only      /.git/config -> 404   /.htaccess -> 200
        #   no .htaccess at all     /.git/config -> 404   /.htaccess -> 404
        #
        # So OUR file DOES produce 403 — via the `<FilesMatch "^\.">` block,
        # which Argus's read did not account for, not via the RedirectMatch. Our
        # file and the parent are therefore indistinguishable by status code on
        # /.git/config, which is exactly why that probe cannot discriminate.
        #
        # ⚠️ AG-4 RESIDUAL 3 — AND ARGUS IS RIGHT AGAIN, SO READ THIS BEFORE
        # TRUSTING THE STEP NAME. I moved this probe from /.git/config to
        # /.htaccess on the reasoning that /.git is never rsynced (so probing it
        # measures ABSENCE) while /.htaccess is our own artifact on the server
        # (so probing it measures DENIAL). The second half does not survive
        # contact with the real hosts. Measured:
        #
        #   production apex   /.htaccess -> 403   and it carries NONE of our files
        #   staging           /.htaccess -> 403
        #
        # Stock Apache denies .ht* at server level, so this probe measures the
        # HOST's policy just as the /.git/config one did. It is defence in depth
        # and worth keeping — a 200 here really would be a live leak — but it
        # does NOT prove our file is in force, and no dotfile status code can.
        #
        # THE CLAIM "our .htaccess is in force" IS CARRIED ENTIRELY BY THE
        # /sitemap.xml CONTENT ASSERTION IN THE PREVIOUS STEP, which checks for
        # the Astro sitemap shape rather than a 200, because production answers
        # that path 200 from WordPress.
        #
        # Either denial code is accepted, because at cutover our file replaces
        # the parent and a hardcoded 403 would hard-fail the deploy at the worst
        # possible moment.
        run: |
          HTA=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${DEPLOY_URL}.htaccess" || echo 000)
          GIT=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${DEPLOY_URL}.git/config" || echo 000)
          CONTROL=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${DEPLOY_URL}no-such-path-control" || echo 000)
          echo ".htaccess      -> HTTP ${HTA}   (our own file — this is the one that discriminates)"
          echo ".git/config    -> HTTP ${GIT}"
          echo "control path   -> HTTP ${CONTROL}"

          # The load-bearing assertion. 200 here means the dotfile guard is off
          # and our server config is being served to anyone who asks.
          case "$HTA" in
            403|404) ;;
            *) echo "::error::/.htaccess returned ${HTA} — our own server config is being served, or the probe failed"
               exit 1 ;;
          esac
          case "$GIT" in
            403|404) ;;
            *) echo "::error::/.git/config is not being denied (got ${GIT})"
               exit 1 ;;
          esac
          echo "dotfiles are not served: our .htaccess ${HTA}, .git/config ${GIT}, missing path ${CONTROL}"
